name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: 1.20.1-forge
            java: 17
            gradle: 8.8
          - dir: 1.21.1-neoforge
            java: 21
            gradle: 8.10.2
          - dir: 26.3-fabric
            java: 25
            gradle: 9.8.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate mod version
        run: echo "MOD_VERSION=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build ${{ matrix.dir }}
        working-directory: ${{ matrix.dir }}
        run: gradle build --no-daemon -Pmod_version=$MOD_VERSION

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}
          path: ${{ matrix.dir }}/build/libs/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
          discard_unmatched_files: true
